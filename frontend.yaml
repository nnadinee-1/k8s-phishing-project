apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      initContainers:
      - name: fetch-html
        image: busybox
        command:
        - sh
        - -c
        - |
          wget -O /html/index.html https://raw.githubusercontent.com/nnadinee-1/k8s-lab-frontend/main/index.html
        volumeMounts:
        - name: html
          mountPath: /html

      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html

      volumes:
      - name: html
        emptyDir: {}
